services:
  postgres:
    image: postgres:16-alpine
    container_name: credit-recovery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: credit_recovery
      POSTGRES_USER: credit_recovery
      POSTGRES_PASSWORD: credit_recovery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_recovery -d credit_recovery"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: